<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="512" height="512" viewBox="0 0 512 512"
     role="img" aria-labelledby="title desc">
  <title id="title">Almazara tradicional</title>
  <desc id="desc">Icono de una piedra de molino dentro de una artesa circular, junto a un pilar de madera.</desc>

  <!-- Fondo transparente -->

  <!-- Pilar de madera -->
  <rect x="306" y="58" width="58" height="318" rx="8"
        fill="#7a5a3a" stroke="#3f2d1e" stroke-width="10"/>
  <path d="M322 74 V358 M346 78 V354"
        fill="none" stroke="#a7835e" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  <path d="M314 134 C328 126 342 142 356 132
           M314 222 C330 214 344 230 358 218"
        fill="none" stroke="#4f3825" stroke-width="5" stroke-linecap="round" opacity="0.75"/>

  <!-- Borde posterior de la artesa -->
  <ellipse cx="232" cy="334" rx="165" ry="74"
           fill="#8c8173" stroke="#453f39" stroke-width="10"/>

  <!-- Interior de la artesa -->
  <ellipse cx="232" cy="326" rx="143" ry="55"
           fill="#4f4a44" stroke="#2f2c29" stroke-width="8"/>

  <!-- Piedra vertical -->
  <path d="M155 319
           C158 252 186 199 225 185
           C267 170 302 199 313 248
           C321 285 311 326 284 352
           C258 377 213 386 180 361
           C163 348 155 336 155 319 Z"
        fill="#77746f" stroke="#343230" stroke-width="10"/>

  <!-- Cara y volumen de la piedra -->
  <path d="M180 336
           C177 278 198 226 232 206
           C257 192 279 205 290 235
           C302 268 295 315 274 341
           C252 367 214 373 190 355 Z"
        fill="#99958e" opacity="0.72"/>
  <path d="M225 191 C211 238 206 292 214 367"
        fill="none" stroke="#5e5b56" stroke-width="7" opacity="0.8"/>

  <!-- Eje de la piedra -->
  <circle cx="232" cy="286" r="16"
          fill="#3b3936" stroke="#1f1e1c" stroke-width="6"/>
  <path d="M232 286 L316 258"
        fill="none" stroke="#5d452f" stroke-width="15" stroke-linecap="round"/>
  <circle cx="316" cy="258" r="9" fill="#2f241a"/>

  <!-- Frente de la artesa -->
  <path d="M67 334
           C67 392 93 436 135 454
           C178 473 284 473 327 454
           C369 436 395 392 395 334
           C372 374 318 398 232 398
           C146 398 90 374 67 334 Z"
        fill="#6f675d" stroke="#3d3934" stroke-width="10"/>

  <!-- Hiladas de fábrica -->
  <path d="M87 382 C154 408 308 410 374 380
           M101 421 C164 442 298 443 361 420"
        fill="none" stroke="#4f4942" stroke-width="7" opacity="0.8"/>

  <!-- Labio superior de la artesa -->
  <path d="M70 333
           C101 374 155 390 232 390
           C309 390 364 374 394 333"
        fill="none" stroke="#a1978b" stroke-width="16" stroke-linecap="round"/>

  <!-- Sombra de contacto del pilar -->
  <ellipse cx="335" cy="377" rx="42" ry="15" fill="#2b2825" opacity="0.35"/>
</svg>
