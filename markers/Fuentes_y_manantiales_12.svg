       Q34 168 56 168
       H220
       V308
       C194 297 174 297 150 310
       C124 324 98 324 72 310
       C57 302 45 301 34 305
       Z"
    fill="#F57C00"/>

  <!-- Bloque naranja derecho, simétrico -->
