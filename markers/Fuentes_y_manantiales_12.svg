  <title id="title">Icono de fuente o surgencia</title>
  <desc id="desc">Flecha azul ascendente entre dos bloques naranjas, sobre dos ondas azules.</desc>

  <!-- Fondo transparente -->

  <!-- Bloque naranja izquierdo, próximo al mástil -->
  <path
