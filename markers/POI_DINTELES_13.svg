<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 88">
  <title>Dintel tradicional de piedra</title>

  <!-- Dintel -->
  <path d="M12 8
           H52
           Q55 8 55 11
           V18
           H9
           V11
           Q9 8 12 8 Z"
        fill="#D0BC98"
        stroke="#3F3329"
        stroke-width="2.5"
        stroke-linejoin="round"/>

  <!-- Inscripción simplificada -->
  <path d="M20 13
           C23 12,25 14,28 13
           M31 13 L34 13
           M37 13 C39 12,41 14,44 13"
        fill="none"
        stroke="#8B7458"
        stroke-width="1.2"
        stroke-linecap="round"/>

  <!-- Jamba izquierda -->
  <rect x="14" y="18" width="8" height="60"
        fill="#C5B08D"
        stroke="#3F3329"
        stroke-width="2.5"/>

  <!-- Jamba derecha -->
  <rect x="42" y="18" width="8" height="60"
        fill="#C5B08D"
        stroke="#3F3329"
        stroke-width="2.5"/>

  <!-- Puerta -->
  <rect x="22" y="20" width="20" height="58"
        fill="#6F5A49"
        stroke="#3F3329"
        stroke-width="2"/>

  <!-- Paneles superiores -->
  <rect x="25" y="24" width="5" height="18"
        fill="#8A745F"
        stroke="#4A3B30"
        stroke-width="1"/>
  <rect x="34" y="24" width="5" height="18"
        fill="#8A745F"
        stroke="#4A3B30"
        stroke-width="1"/>

  <!-- Travesaño -->
  <line x1="22" y1="44" x2="42" y2="44"
        stroke="#4A3B30"
        stroke-width="2"/>

  <!-- Tablas inferiores -->
  <g stroke="#4A3B30" stroke-width="1">
    <line x1="26" y1="44" x2="26" y2="76"/>
    <line x1="30" y1="44" x2="30" y2="76"/>
    <line x1="34" y1="44" x2="34" y2="76"/>
    <line x1="38" y1="44" x2="38" y2="76"/>
  </g>
</svg>
